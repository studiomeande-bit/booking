<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>수령 확인 · Studio mean</title>
<style>
  :root{
    --bg:#16151a; --card:#211f27; --card2:#2a2831; --line:#38353f;
    --tx:#f1efe9; --dim:#a09aa8; --accent:#c8b89a;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#7dd3fc;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
    font-size:15px;line-height:1.5;
    padding:0 0 calc(28px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky;top:0;z-index:20;background:rgba(22,21,26,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
    display:flex;align-items:center;gap:10px;
  }
  header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px;flex:1;min-width:0;}
  header .sub{display:block;font-size:11px;font-weight:400;color:var(--dim);margin-top:2px;}
  .wrap{max-width:640px;margin:0 auto;padding:16px;}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--tx);padding:9px 14px;}
  button:active{transform:translateY(1px);}
  button[disabled]{opacity:.45;cursor:default;}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--dim);font-size:12px;padding:6px 10px;}
  .btn-main{background:var(--accent);border-color:var(--accent);color:#26221b;font-weight:800;
    padding:13px 18px;font-size:15px;min-height:46px;flex:1;}
  .btn-mail{background:#7dd3fc;border-color:#7dd3fc;color:#0b2330;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 15px;margin-bottom:12px;}
  .card.gone{opacity:.35;}
  .row{display:flex;align-items:flex-start;gap:10px;}
  .nm{font-size:17px;font-weight:700;letter-spacing:-.2px;word-break:break-word;}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .b-noshow{background:#3b1d1d;color:var(--bad);border:1px solid #5c2b2b;}
  .b-unclaimed{background:#3a2f14;color:var(--warn);border:1px solid #5c4a1f;}
  .b-toship{background:#123040;color:var(--info);border:1px solid #1d4c63;}
  .b-fresh{background:#232d27;color:var(--ok);border:1px solid #2f4a3b;}
  .meta{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.65;word-break:break-word;}
  .meta b{color:#cfc9d6;font-weight:600;}
  .money{display:inline-block;margin-top:7px;font-size:12px;color:#e7d9b8;
    background:#332c1d;border:1px solid #4a3f27;border-radius:8px;padding:3px 9px;}
  .acts{display:flex;gap:8px;margin-top:13px;}
  .more{margin-top:9px;display:flex;flex-wrap:wrap;gap:8px;}
  .empty{text-align:center;color:var(--dim);padding:48px 20px;font-size:14px;line-height:1.9;}
  .empty .big{font-size:34px;display:block;margin-bottom:10px;}
  .sec{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.06em;
    text-transform:uppercase;margin:22px 2px 10px;}
  .sec:first-child{margin-top:4px;}
  #toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:60;max-width:616px;margin:0 auto;background:var(--card2);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;display:none;align-items:center;gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:13.5px;}
  #toast.show{display:flex;}
  #toast .msg{flex:1;min-width:0;}
  .lock{padding:60px 22px;text-align:center;}
  .lock input{width:100%;max-width:280px;margin:16px auto 12px;display:block;text-align:center;
    font-size:22px;letter-spacing:.28em;padding:13px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);color:var(--tx);}
  .err{color:var(--bad);font-size:13px;min-height:20px;}
  .note{font-size:11.5px;color:var(--dim);margin-top:26px;line-height:1.7;text-align:center;}
</style>
</head>
<body>
<header>
  <h1>수령 확인<span class="sub" id="hdSub">불러오는 중…</span></h1>
  <button class="btn-ghost" id="btnReload" type="button">새로고침</button>
</header>

<div class="wrap">
  <div id="lock" class="lock" hidden>
    <div style="font-size:38px;">🔒</div>
    <div style="margin-top:10px;font-size:14px;color:var(--dim);">스튜디오 PIN을 입력해 주세요.</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <div class="err" id="lockErr"></div>
    <button class="btn-main" id="btnUnlock" type="button" style="max-width:280px;margin:6px auto 0;">열기</button>
  </div>

  <div id="list" hidden></div>

  <div class="note" id="note" hidden>
    인화물을 고객에게 전달한 직후 눌러 주세요.<br>
    우편은 실제로 부친 뒤에 누르면 고객에게 발송 안내 메일이 나갑니다.
  </div>
</div>

<div id="toast"><span class="msg"></span><button class="btn-ghost" id="toastBtn" type="button" hidden>되돌리기</button></div>
<script src="handover.js?v=a3c9338b78"></script>
</body>
</html>
