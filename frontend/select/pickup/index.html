<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Studio mean - Pickup</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="icon" href="../studio-mean-logo.svg" type="image/svg+xml">
  <meta name="description" content="Studio mean - Book your print pickup time.">
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", "Avenir Next", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(245, 235, 220, 0.52), transparent 28%),
        linear-gradient(180deg, #f9f6ef 0%, #f7f2e8 100%);
      color: #2f2924;
      min-height: 100vh;
    }
    .shell { width: min(560px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 72px; }
    .hidden { display: none !important; }
    .brand { display: block; width: min(260px, 60vw); margin: 0 auto 6px; }
    h1 { text-align: center; font-size: 22px; margin: 8px 0 4px; }
    .lede { text-align: center; color: #6b5f52; font-size: 13.5px; margin: 0 0 20px; line-height: 1.6; }
    .card {
      background: #fffdf8;
      border: 1px solid #e7ddcc;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 10px 26px rgba(80, 62, 40, 0.06);
    }
    .card-title { font-weight: 700; font-size: 14px; margin-bottom: 8px; }
    .copy { font-size: 13.5px; color: #55493d; line-height: 1.7; }
    .status-banner {
      text-align: center; font-size: 13.5px; padding: 12px 16px; border-radius: 12px;
      background: #f3ecdd; color: #6b5f52; margin-bottom: 16px; line-height: 1.6;
    }
    .status-banner.error { background: #fdecec; color: #a13c3c; }
    .status-banner.ok { background: #e8f2e4; color: #3f6b34; }
    .cal-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .cal-toolbar strong { font-size: 15px; }
    .nav-btn {
      border: 1px solid #d9cfbf; background: #fff; color: #3c3129;
      border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    }
    .nav-btn:disabled { opacity: .4; cursor: default; }
    .weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .weekdays span { text-align: center; font-size: 11px; color: #9a8c79; padding: 4px 0; }
    .day-btn {
      border: 1px solid #e7ddcc; background: #fff; color: #3c3129; border-radius: 12px;
      padding: 10px 0; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
    }
    .day-btn:disabled { background: #f6f1e6; color: #c9bda9; border-color: #efe7d6; cursor: default; }
    .day-btn.empty { visibility: hidden; }
    .day-btn.selected { background: #2f2924; border-color: #2f2924; color: #fff; }
    .slot-hint { font-size: 12.5px; color: #6b5f52; margin: 14px 0 8px; }
    .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
    .slot-btn {
      border: 1px solid #d9cfbf; border-radius: 999px; background: #fff; color: #3c3129;
      padding: 11px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .slot-btn.selected { background: #2f2924; border-color: #2f2924; color: #fff; }
    .empty-state { font-size: 12.5px; color: #9a8c79; padding: 10px 4px; }
    .confirm-btn {
      display: block; width: 100%; border: 0; border-radius: 999px; margin-top: 18px;
      background: #2f2924; color: #fff; padding: 14px 18px; font: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer;
    }
    .confirm-btn:disabled { opacity: .35; cursor: default; }
    .success-check { text-align: center; font-size: 44px; margin: 6px 0 2px; }
    .success-when { text-align: center; font-size: 19px; font-weight: 800; margin: 6px 0 14px; }
    .addr { text-align: center; font-size: 13px; color: #55493d; line-height: 1.7; }
    .current-line { font-size: 13.5px; background: #eef4ea; border: 1px solid #cfe0c6; color: #3f6b34; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; line-height: 1.6; }
    .link-btn { border: 0; background: none; color: #2f6b3c; font: inherit; font-size: 13px; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }
    .footer { text-align: center; font-size: 11px; color: #9a8c79; margin-top: 26px; line-height: 1.7; }
  </style>
</head>
<body>
  <main class="shell">
    <img src="../studio-mean-logo.svg?v=20260415-logo3" alt="Studio mean" class="brand">
    <h1 id="pageTitle">픽업 시간 예약</h1>
    <p class="lede" id="pageLede">인화가 완료된 사진을 수령할 시간을 선택해 주세요.</p>

    <div id="statusBanner" class="status-banner">불러오는 중입니다…</div>

    <section id="currentBox" class="card hidden">
      <div id="currentLine" class="current-line"></div>
      <button id="changeBtn" class="link-btn" type="button">다른 시간으로 변경하기</button>
    </section>

    <section id="schedulerCard" class="card hidden">
      <div class="card-title" id="calTitle">날짜 선택</div>
      <div class="copy" id="calCopy">스튜디오 운영 일정이 있는 날에만 픽업이 가능합니다.</div>
      <div class="cal-toolbar">
        <button id="prevMonthBtn" class="nav-btn" type="button">←</button>
        <strong id="monthLabel">-</strong>
        <button id="nextMonthBtn" class="nav-btn" type="button">→</button>
      </div>
      <div class="weekdays" id="weekdayRow"></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="slot-hint" id="slotHint"></div>
      <div class="slot-grid" id="slotGrid"><div class="empty-state" id="slotEmpty">날짜를 먼저 선택해 주세요.</div></div>
      <button id="confirmBtn" class="confirm-btn" type="button" disabled>픽업 예약 확정</button>
    </section>

    <section id="mailSwitchCard" class="card hidden">
      <div class="card-title" id="msTitle">우편 수령으로 변경</div>
      <div class="copy" id="msCopy">직접 방문이 어려우시면 우편 수령으로 변경할 수 있습니다. 예약된 픽업이 있다면 자동으로 취소됩니다.</div>
      <button id="msOpenBtn" class="nav-btn" type="button" style="margin-top:10px;">📮 우편 수령으로 변경하기</button>
      <div id="msForm" class="hidden" style="margin-top:14px;">
        <label class="copy" for="msName" id="msNameLabel" style="display:block;font-weight:700;margin-bottom:4px;">받으실 분 성함</label>
        <input id="msName" type="text" autocomplete="name" style="width:100%;border:1px solid #d9cfbf;border-radius:12px;background:#fff;color:#2f2924;padding:11px 14px;font:inherit;font-size:14px;margin-bottom:10px;">
        <label class="copy" for="msAddr" id="msAddrLabel" style="display:block;font-weight:700;margin-bottom:4px;">주소 (우편번호 + 도시 포함)</label>
        <textarea id="msAddr" rows="3" autocomplete="street-address" placeholder="Musterstraße 1, 61440 Oberursel" style="width:100%;border:1px solid #d9cfbf;border-radius:12px;background:#fff;color:#2f2924;padding:11px 14px;font:inherit;font-size:14px;resize:vertical;"></textarea>
        <button id="msSubmitBtn" class="confirm-btn" type="button">우편 수령으로 변경 확정</button>
      </div>
    </section>

    <section id="successCard" class="card hidden">
      <div class="success-check">✅</div>
      <div class="success-when" id="successWhen"></div>
      <div class="addr" id="successAddr"></div>
      <div class="copy" id="successNote" style="text-align:center;margin-top:12px;"></div>
      <div style="text-align:center;margin-top:14px;"><button id="rebookBtn" class="link-btn" type="button">다른 시간으로 변경하기</button></div>
    </section>

    <div class="footer">Studio mean · Holzweg-Passage 3, 61440 Oberursel (Taunus)<br>studio.mean.de@gmail.com · +49 176 60939400</div>
  </main>
  <script src="./pickup.js?v=411467eaba"></script>
</body>
</html>
