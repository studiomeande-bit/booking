# 포트폴리오(studio-mean.com) → IONOS 자동 배포 (SFTP / lftp)
# - main 브랜치에서 frontend/portfolio/** 가 바뀌면 SFTP로 증분 업로드(--only-newer)
# - Actions 탭에서 수동 실행 가능 (dry_run: 업로드 없이 변경 목록만)
# - 필요 시크릿:
#     IONOS_FTP_HOST      예) access-5018383375.webspace-host.com
#     IONOS_FTP_USERNAME  예) a2515000
#     IONOS_FTP_PASSWORD  해당 SFTP 계정 비밀번호
#     IONOS_SERVER_DIR    (선택) 웹 루트 경로, '/'로 끝나게. 미설정 시 '/'
name: Deploy portfolio to IONOS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/portfolio/**'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '테스트 실행 (업로드 없이 변경 목록만 로그로 확인)'
        type: boolean
        default: false

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp and sshpass
        run: sudo apt-get update && sudo apt-get install -y lftp sshpass

      - name: Deploy via SFTP (mirror, incremental)
        env:
          IONOS_HOST: ${{ secrets.IONOS_FTP_HOST }}
          IONOS_USER: ${{ secrets.IONOS_FTP_USERNAME }}
          # sshpass가 SSHPASS 환경변수에서 비밀번호를 읽어 ssh에 주입 (스크립트 텍스트에 비밀번호 미노출)
          SSHPASS: ${{ secrets.IONOS_FTP_PASSWORD }}
          IONOS_DIR: ${{ secrets.IONOS_SERVER_DIR }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${IONOS_HOST:-}" ] || [ -z "${IONOS_USER:-}" ] || [ -z "${SSHPASS:-}" ]; then
            echo "::error::IONOS_FTP_HOST / IONOS_FTP_USERNAME / IONOS_FTP_PASSWORD 시크릿이 설정되지 않았습니다."
            exit 1
          fi
          DEST="${IONOS_DIR:-/}"
          DRYFLAG=""
          if [ "${DRY_RUN:-false}" = "true" ]; then
            DRYFLAG="--dry-run"
            echo "▶ DRY-RUN: 실제 업로드 없이 변경 목록만 출력합니다."
          fi
          # ── 인증 격리 진단: lftp 없이 순수 sftp+sshpass로 로그인만 시험 ──
          echo "── 인증 격리 테스트 (sftp 직접) ──"
          set +e
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=accept-new \
            -oPreferredAuthentications=password -oPubkeyAuthentication=no \
            -oConnectTimeout=15 -b - "${IONOS_USER}@${IONOS_HOST}" <<'SFTPDIAG' 2>&1 | grep -iE 'permission denied|denied \(|authenticated|pwd|remote working|/kunden|/home|Could not|refused|closed|password' | head -10
          pwd
          bye
          SFTPDIAG
          echo "AUTH_TEST_EXIT=$?"
          set -e
          # lftp의 SFTP는 외부 openssh로 연결되는데 openssh는 비밀번호를 tty로만 받으므로,
          # sshpass -e 로 SSHPASS 환경변수의 비밀번호를 ssh에 주입한다.
          # lftp에는 더미 비밀번호(-u user,x)를 줘서 자체 GetPass 프롬프트를 막고,
          # 실제 인증은 sshpass -e(SSHPASS 환경변수)가 ssh에 주입한다. 격리 테스트로 검증된 방식.
          lftp <<LFTPEOF
          set sftp:auto-confirm yes
          set sftp:connect-program "sshpass -e ssh -a -x -oBatchMode=no -oStrictHostKeyChecking=accept-new -oPreferredAuthentications=password -oPubkeyAuthentication=no"
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set mirror:parallel-directories no
          set mirror:use-pget-n 1
          open -u "${IONOS_USER},x" sftp://${IONOS_HOST}
          pwd
          mirror --reverse ${DRYFLAG} --verbose --only-newer \
            --exclude-glob .git* \
            --exclude-glob .netlify/ \
            --exclude-glob node_modules/ \
            --exclude README.md \
            --exclude netlify.toml \
            --exclude generate-portfolio-data.py \
            --exclude refresh-drive-data.sh \
            frontend/portfolio/ ${DEST}
          bye
          LFTPEOF
          echo "✅ SFTP 배포 완료 (DEST=${DEST})"
